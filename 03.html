<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本格式化标签</title>
</head>
<body>
    <strong>我是一段加粗文本</strong>
    <em>我是一段斜体文本</em>
    <ins>我是一段下划线文本</ins>
    <del>我是一段删除线文本</del>
</body>
</html>
